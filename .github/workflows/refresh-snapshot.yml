name: Refresh offline snapshot

# Keeps the bundled fallback data fresh: downloads the USGS 30-day feed weekly,
# rebuilds public/data/snapshot.json, commits it and redeploys.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: curl -fsSL https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_month.geojson -o /tmp/all_month.geojson
      - run: node scripts/snapshot.ts /tmp/all_month.geojson
      - name: Commit if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/snapshot.json
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Refresh USGS snapshot"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # Pushes made with GITHUB_TOKEN don't trigger other workflows; workflow_dispatch does.
      - name: Redeploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main
